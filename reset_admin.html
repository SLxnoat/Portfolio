<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Temporary Admin Reset</title>
  <style>
    body{background:#07070a;color:#fff;font-family:Inter,monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:rgba(10,10,15,0.95);padding:2rem;border-radius:12px;border:1px solid rgba(0,240,255,0.08);max-width:520px;width:100%}
    input{width:100%;Padding:.9rem;margin-top:.5rem;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.5);color:#fff}
    button{margin-top:1rem;padding:.75rem 1.2rem;border-radius:10px;border:none;background:linear-gradient(90deg,#00f0ff,#b900ff);color:#000;font-weight:700;cursor:pointer}
    small{display:block;margin-top:.5rem;color:rgba(255,255,255,0.5)}
  </style>
</head>
<body>
  <div class="card">
    <h3 style="margin:0 0 .5rem 0">Temporary Admin Password Reset</h3>
    <p style="margin:0 0 1rem 0;color:rgba(255,255,255,0.7)">This page will update the `adminPassword` field in the site's local IndexedDB record. Remove this file after use.</p>
    <label for="pwd">New passphrase</label>
    <input id="pwd" type="password" placeholder="Enter new admin passphrase">
    <button id="do">Update password and open admin</button>
    <small id="status">No action taken yet.</small>
  </div>

  <script>
    // Helper: create the expected DB stores (safe to call in onupgradeneeded)
    function createSchema(db) {
      try {
        if(!db.objectStoreNames.contains('profile')) db.createObjectStore('profile', { keyPath: 'id' });
        if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id', autoIncrement: true });
        if(!db.objectStoreNames.contains('skills')) db.createObjectStore('skills', { keyPath: 'id', autoIncrement: true });
        if(!db.objectStoreNames.contains('experience')) db.createObjectStore('experience', { keyPath: 'id', autoIncrement: true });
        if(!db.objectStoreNames.contains('education')) db.createObjectStore('education', { keyPath: 'id', autoIncrement: true });
        if(!db.objectStoreNames.contains('messages')) db.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
        if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
        if(!db.objectStoreNames.contains('analytics')) db.createObjectStore('analytics', { keyPath: 'id', autoIncrement: true });
      } catch (e) {
        console.warn('createSchema error', e);
      }
    }

    async function ensureDBHasProfileStore() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('OS_PRIME_DataStore');
        let handled = false;
        req.onsuccess = function() {
          const db = req.result;
          if (db.objectStoreNames.contains('profile')) {
            resolve(db);
          } else {
            // Need to upgrade DB version to create stores
            const nextVersion = (db.version || 1) + 1;
            db.close();
            const req2 = indexedDB.open('OS_PRIME_DataStore', nextVersion);
            req2.onupgradeneeded = function(e) {
              createSchema(e.target.result);
            };
            req2.onsuccess = function() { handled = true; resolve(req2.result); };
            req2.onerror = function(e) { handled = true; reject(e); };
          }
        };
        req.onupgradeneeded = function(e) { createSchema(e.target.result); };
        req.onerror = function(e) { if(!handled) reject(e); };
      });
    }

    async function writeNewPassword(newPwd) {
      const status = document.getElementById('status');
      status.textContent = 'Preparing database...';
      try {
        const db = await ensureDBHasProfileStore();
        const tx = db.transaction('profile', 'readwrite');
        const store = tx.objectStore('profile');
        const getReq = store.get('main');
        getReq.onsuccess = function() {
          const profile = getReq.result || { id: 'main' };
          profile.adminPassword = newPwd;
          const putReq = store.put(profile);
          putReq.onsuccess = function() {
            try{ sessionStorage.setItem('sys_auth_token', Date.now()); }catch(e){}
            status.textContent = 'Password updated. Redirecting to admin...';
            setTimeout(()=> window.location.href = 'admin.html', 900);
          };
          putReq.onerror = function(e) { status.textContent = 'Failed to write profile: ' + (e.target && e.target.error && e.target.error.message || e.message); };
        };
        getReq.onerror = function(e) { status.textContent = 'Failed to read profile: ' + (e.target && e.target.error && e.target.error.message || e.message); };
      } catch (err) {
        document.getElementById('status').textContent = 'DB error: ' + (err && (err.message || err.target && err.target.error && err.target.error.message) || err);
      }
    }

    document.getElementById('do').addEventListener('click', () => {
      const newPwd = document.getElementById('pwd').value.trim();
      if(!newPwd) { document.getElementById('status').textContent = 'Please enter a non-empty passphrase.'; return; }
      writeNewPassword(newPwd);
    });
  </script>
</body>
</html>
