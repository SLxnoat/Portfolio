<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js" defer></script>
    <script>
        // Security Gate check with 30m expiry
        const setAuthToken = (value) => {
            try { sessionStorage.setItem('sys_auth_token', value); return true; } catch (e) { }
            try { localStorage.setItem('sys_auth_token', value); return true; } catch (e) { }
            return false;
        };

        const getAuthToken = () => {
            try { const token = sessionStorage.getItem('sys_auth_token'); if (token) return token; } catch (e) { }
            try { const token = localStorage.getItem('sys_auth_token'); if (token) return token; } catch (e) { }
            return null;
        };

        const clearAuthToken = () => {
            try { sessionStorage.removeItem('sys_auth_token'); } catch (e) { }
            try { localStorage.removeItem('sys_auth_token'); } catch (e) { }
        };

        (() => {
            const token = getAuthToken();
            const sessionStart = parseInt(token);
            if(!token || isNaN(sessionStart) || (Date.now() - sessionStart) > (30 * 60 * 1000)) {
                clearAuthToken();
                window.location.replace('index.html');
            }
        })();
    </script>
</head>
<body class="bg-dark text-white" style="background-color: #07070a !important;">
    
    <div id="admin-root" class="min-vh-100 overflow-hidden">
        <!-- Dashboard injected here -->
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
